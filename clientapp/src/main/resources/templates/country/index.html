<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/main.html}">

<head>

    <title>Country</title>
</head>
<body>
    <section class="container" layout:fragment="content">
        <div class="mt-5 d-flex justify-content-between align-items-center">
            <h1 class="fw-bold">List of Country</h1>

            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#create">
                Add Country
            </button>
        </div>

        <table class="table mt-3 table-hover table-striped table-bordered text-center
                      shadow-lg bg-body rounded" id="table-country">
            <thead class="table-dark">
                <tr>
                    <th class="col-2 text-center">No</th>
                    <th class="col-2 text-center">Code</th>
                    <th class="col-4 text-center">Name</th>
                    <th class="col-4 text-center">Region-Name</th>
                    <th class="col-6 text-center">Action</th>
                </tr>
            </thead>
        </table>

        <!-- Modal Detail -->
        <div class="modal fade" id="detail" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="detailLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title" id="detailLabel">Country Detail</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                    <div class="modal-body">
                        <div class="input-grup mt-2 mb-4">
                            <span class="input-grup-text fw-bold bg-secondary-subtle"
                            id="d-id">Country Id : </span>
                            <input type="text" class="form-control" aria-label="Sizing example input"
                            aria-describedby="d-id" id="detail-id" readonly/>
                        </div>
                        <div class="input-grup mt-2 mb-4">
                          <span class="input-grup-text fw-bold bg-secondary-subtle"
                          id="d-name">Country Name : </span>
                          <input type="text" class="form-control" aria-label="Sizing example input"
                          aria-describedby="d-name" id="detail-name" readonly/>
                      </div>
                        <div class="input-grup mt-2 mb-4">
                          <span class="input-grup-text fw-bold bg-secondary-subtle"
                          id="d-name">Code Name : </span>
                          <input type="text" class="form-control" aria-label="Sizing example input"
                          aria-describedby="d-code" id="detail-code" readonly/>
                      </div>
                        <div class="input-grup mt-2 mb-4">
                          <span class="input-grup-text fw-bold bg-secondary-subtle"
                          id="d-name">Region Name : </span>
                          <input type="text" class="form-control" aria-label="Sizing example input"
                          aria-describedby="d-region-name" id="detail-region-name" readonly/>
                      </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
              </div>
            </div>
          </div>

        <!-- Modal Create -->
        <div class="modal fade" id="create" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="createLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title" id="createLabel">Add Country</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="input-grup mt-2">
                            <span class="input-grup-text fw-bold bg-secondary-subtle" id="code">Code</span>
                            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="code"
                            id="create-code" required/>
                        </div>
                        <div class="input-grup mt-2">
                            <span class="input-grup-text fw-bold bg-secondary-subtle" id="name">Name</span>
                            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="name"
                            id="create-name" required/>
                        </div>
                    </div>
                    <div class="input-grup mt-4">
                        <select name="regionId" class="form-select" aria-label="Select example" aria-describedby="region" id="region" required>
                            <option>Select Region</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button id="create-country" type="submit" class="btn btn-success">Save</button>
                    </div>
                   </form> 
              </div>
            </div>
          </div>

        <!-- Modal Update -->
        <div class="modal fade" id="update" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="updateLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title" id="updateLabel">Update Country</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="input-grup mt-2">
                            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="code"
                            id="update-id" hidden/>
                        </div>
                        <div class="input-grup mt-2">
                            <span class="input-grup-text fw-bold bg-secondary-subtle" id="code">Country Code</span>
                            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="code"
                            id="update-code" required/>
                        </div>
                        <div class="input-grup mt-2">
                            <span class="input-grup-text fw-bold bg-secondary-subtle" id="name">Country Name</span>
                            <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="name"
                            id="update-name" required/>
                        </div>
                    </div>
                    <div class="input-grup mt-2">
                        <select class="form-select" aria-label="Default selext example" aria-describedby="up-list-reg" id="update-list-region">
                            <option>Select Region</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button id="update-country" type="submit" class="btn btn-success">Save</button>
                    </div>
                   </form> 
              </div>
            </div>
          </div>


    </section>

    <div layout:fragment="js">
        <script th:src="@{/js/country.js}"></script>
        <script th:src="@{/js/home.js}"></script>
    </div>


</body>
</html>
