<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="shortcut icon" th:href="@{/img/Transformer-icon.png}" type="image/x-icon">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <title>Detail</title>
</head>
<body>

    <section class="container">
        <div class="card mt-5">
            <h2 class="card-header fw-bold text-center">Region Detail</h2>
            <form th:action="@{/region}" th:method="post" th:object="${region}">
                <div class="card-body">
                    <table class="table mt-2 table-hover table-striped table-bordered">
                        <tbody>
                            <tr>
                                <th class="col-2">ID Region</th>
                                <td th:text="${region.id}"></td>
                            </tr>
                                <th>Name</th>
                                <td th:text="${region.name}"></td>
                        </tbody>
                    </table>

                    <div class="d-flex gap-3">
                        <a th:href="@{/region}" class="btn btn-secondary">Back</a>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
